<div class="d-flex justify-content-center">  <!-- Esta linea centra el contenido en cuanto a posicion horizontal -->
        <div id="register" class="register card text-left" style="width: 450px;">  
                <h2 class="card-title text-center"> Creando cuenta </h2> 
                <label for="nombre" class="card-text"> Nombre: </label> <br> 
                <input class="form-control" type="text" id="nombre" required> <br>
                <label for="user" class="card-text"> Usuario: </label> <br>
                <input class="form-control" type="text" id="user" required> <br>
                <label for="email" class="card-text"> Correo: </label> <br>
                <input class="form-control" type="email" id="email" required> <br> 
                <label for="telefono"> Teléfono: </label> <br>
                <input class="form-control" type="tel" id="telefono" required> <br>
                <label for="password"> Contraseña: </label> <br> 
                <input class="form-control" type="password" id ="contraseña" required minlength="8"> <br> 
                <label for="contraseñaC"> Confirmar contraseña: </label> <br>
                <input class="form-control" type="password" id="contraseñaC" required minlength="8"> <br>  
                <p id="alerta"></p>
                <input type="submit" value="Registrarse" id="Registro" class="btn btn-dark"> 
                <p> Ya tienes cuenta? <a href="login.html"> Inicia sesión </a> </p>
