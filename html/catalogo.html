<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="../img/LogoHourtz.png">
    <title>Hourtz</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body x-data="catalogoApp()" x-init="init()">

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">

            <a class="navbar-brand" href="index_notLogged.html">Hz</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <form class="d-flex mt-3 mt-lg-0 position-relative" role="search" onsubmit="return false;">
                <input
                    id="buscador"
                    class="form-control me-2"
                    type="search"
                    placeholder="Buscar canción o artista"
                    aria-label="Search"
                    autocomplete="off">
                <div id="resultadosBusqueda"
                     class="list-group position-absolute w-100 shadow"
                     style="top: 100%; z-index: 1050; max-height: 320px; overflow-y: auto; display: none;">
                </div>
            </form>

            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                <a class="nav-link" href="playlist.html">Playlist</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="perfil.html" id="userName">Perfil</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="catalogo.html">Catálogo</a>
                </li>
                <li class="nav-item" id="navItemLogin">
                    <a class="nav-link" href="login.html">Iniciar sesión</a>
                </li>
                <li class="nav-item" id="navItemRegister">
                    <a class="nav-link" href="register.html">Registrarse</a>
                </li>
                <li class="nav-item d-none" id="navItemLogout">
                    <a class="nav-link" href="#" onclick="cerrarSesion(event)">Cerrar sesión</a>
                </li>
            </ul>
        </div>
    </nav>

    <section class="container py-5">

        <h2 class="text-center mb-4">
            Géneros musicales
        </h2>

        <!-- Buscador del catálogo (x-model) -->
        <div class="row justify-content-center mb-4">
            <div class="col-12 col-md-6">
                <input type="text"
                       class="form-control"
                       placeholder="Filtrar géneros por nombre..."
                       x-model="busqueda">
            </div>
        </div>

        <!-- Mensaje: cargando (x-show) -->
        <div x-show="cargando" class="text-center py-5">
            <div class="spinner-border text-primary mb-3" role="status"></div>
            <p class="text-secondary">Cargando géneros...</p>
        </div>

        <!-- Mensaje: error (x-show) -->
        <div x-show="!cargando && error" class="alert alert-danger text-center" role="alert">
            <strong>Error:</strong> <span x-text="error"></span>
            <button class="btn btn-sm btn-outline-light ms-3" @click="recargar()">Reintentar</button>
        </div>

        <!-- Mensaje: sin resultados (x-show) -->
        <div x-show="!cargando && !error && filtrados.length === 0" class="text-center py-5">
            <p class="text-secondary" x-text="mensajeVacio()"></p>
            <button class="btn btn-outline-primary" @click="busqueda = ''" x-show="busqueda">
                Limpiar búsqueda
            </button>
        </div>

        <!-- Tarjetas (x-for con :key) -->
        <div class="row" x-show="!cargando && !error && filtrados.length > 0">

            <template x-for="genero in filtrados" :key="genero.id">

                <div class="col-md-4 mb-3">

                    <div class="card h-100 tarjeta-musica">

                        <div class="card-body d-flex align-items-center justify-content-between w-100">
                            <div>
                                <h5 class="card-title" x-text="genero.nombre"></h5>

                                <p class="card-text" x-text="genero.descripcion"></p>

                                <button class="btn btn-primary"
                                        :data-audio="genero.audio"
                                        @click="reproducir(genero)"
                                        x-text="estaSonando(genero) ? 'Pausar' : 'Probar'">
                                </button>
                            </div>
                            <img :src="genero.imagen"
                                 :alt="genero.nombre"
                                 class="img-fluid rounded ms-3"
                                 style="width: 100px; height: 100px; object-fit: cover;">
                        </div>

                    </div>

                </div>

            </template>

        </div>

    </section>

    <script>
        function catalogoApp() {
            return {
                // Estado
                generos: [],
                busqueda: '',
                cargando: true,
                error: null,

                // Audio
                audioActual: null,
                srcSonando: null,
                reproduciendo: false,

                // Computed: filtra por nombre
                get filtrados() {
                    const t = this.busqueda.toLowerCase().trim();
                    if (!t) return this.generos;
                    return this.generos.filter(g =>
                        (g.nombre || '').toLowerCase().includes(t) ||
                        (g.descripcion || '').toLowerCase().includes(t)
                    );
                },

                // Ciclo de vida
                async init() {
                    await this.cargarGeneros();
                },

                async cargarGeneros() {
                    this.cargando = true;
                    this.error = null;
                    try {
                        const res = await fetch('../Json/datos.json');
                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                        const data = await res.json();
                        this.generos = data.generos || [];
                        if (this.generos.length === 0) {
                            throw new Error('El catálogo de géneros está vacío');
                        }
                    } catch (e) {
                        console.error(e);
                        this.error = e.message || 'No se pudo cargar el catálogo';
                    } finally {
                        this.cargando = false;
                    }
                },

                recargar() {
                    this.cargarGeneros();
                },

                // Audio (misma lógica que funciones.js, pero reactiva)
                reproducir(genero) {
                    if (!genero.audio) return;

                    if (this.srcSonando === genero.audio) {
                        if (this.audioActual.paused) {
                            this.audioActual.play();
                            this.reproduciendo = true;
                        } else {
                            this.audioActual.pause();
                            this.reproduciendo = false;
                        }
                        return;
                    }

                    if (this.audioActual) this.audioActual.pause();

                    this.audioActual = new Audio(genero.audio);
                    this.audioActual.volume = 0.2;
                    this.srcSonando = genero.audio;
                    this.reproduciendo = true;

                    this.audioActual.addEventListener('ended', () => {
                        this.reproduciendo = false;
                        this.srcSonando = null;
                    });

                    this.audioActual.play().catch(err => {
                        console.error('Playback falló:', err);
                        this.reproduciendo = false;
                    });
                },

                estaSonando(genero) {
                    return this.srcSonando === genero.audio && this.reproduciendo;
                },

                mensajeVacio() {
                    return this.busqueda
                        ? `Sin resultados para «${this.busqueda}».`
                        : 'No hay géneros disponibles.';
                }
            };
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <script src="../javascript/funciones.js"></script>
</body>
</html>
