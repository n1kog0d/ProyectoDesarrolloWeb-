<div class="d-flex justify-content-center w-100">
        <div id="register" class="register card " style="width: 450px;">  
                <h2 class="card-title text-center"> Creando cuenta </h2> 

            <form onsubmit="mostrarAlertaregister(event)">
                <label for="nombre" class="card-text"> Nombre y apellido: </label>  
                <input class="form-control" type="text" id="nombre" minlength="3" maxlength="50" required> <br>
                <label for="user" class="card-text"> Usuario: </label> 
                <input class="form-control" type="text" id="user" minlength="3" maxlength="14" required> <br>
                <label for="email" class="card-text"> Correo: </label> 
                <input class="form-control" type="email" id="email" placeholder="abcde@gmail.com " pattern=".+@gmail\.com" required> <br> 
                <label for="telefono"> Teléfono: </label> 
                <input class="form-control" type="tel" id="telefono" placeholder="Ejemplo:(+56) 92345678"pattern="[0-9]{9}" required> <br>
                <label for="password"> Contraseña (mínimo 8 caracteres): </label> 
                <input class="form-control" type="password" id ="contraseña" required minlength="8"> <br> 
                <label for="contraseñaC"> Confirmar contraseña: </label> 
                <input class="form-control" type="password" id="contraseñaC" required>   
                <p id="alerta"></p>
                <button type="submit" class="btn btn-dark">Registro</button>  
                <p> Ya tienes cuenta? <a href="login.html" style="color: rgb(226, 244, 249);"> Inicia sesión </a> </p>
            </form>
    </div> 
</div>

 <div class="toast-container position-fixed bottom-0 end-0 p-3">

      <strong class="me-auto">¡Éxito!</strong>
      <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
